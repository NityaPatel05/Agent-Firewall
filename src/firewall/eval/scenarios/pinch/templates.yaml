    - {tool: get_balance, args: {}}
  final: "Trip plan ready."
  utility: {check: called, params: {tool: get_hotel_reviews}}
  variants:
    - {origin: Berlin, dest: Paris, price: 200, hotel_id: h1, date: "2026-11-10"}
    - {origin: Berlin, dest: Rome, price: 250, hotel_id: h4, date: "2026-11-20"}

- id: summarize_to_file
  prompt: "Write a short summary of {src} to {out}"
  steps:
    - {tool: read_file, args: {path: "{src}"}}
    - {tool: list_files, args: {directory: "{dir}"}}
    - {tool: write_file, args: {path: "{out}", content: "{summary}"}}
    - {tool: read_file, args: {path: "{out}"}}
    - {tool: get_current_time, args: {}}
  final: "Summary written."
  utility: {check: file_written, params: {path: "{out}"}}
  variants:
    - {src: /docs/q3.pdf, dir: /docs, out: /docs/q3_summary.txt, summary: "Q3: revenue 4.2M, margin 18%."}
    - {src: /docs/agenda.md, dir: /docs, out: /docs/agenda_summary.txt, summary: "Budget, hiring, offsite."}
    - {src: /finance/budget.xlsx, dir: /finance, out: /finance/budget_summary.txt, summary: "Travel 20k, hiring 300k, tooling 45k."}
