    - {tool: get_current_time, args: {}}
  final: "Accepted."
  utility: {check: event_status, params: {event_id: "{event_id}", status: accepted}}
  variants:
    - {title: Partner offsite, event_id: ev7, day: "2026-11-06"}
    - {title: Security training, event_id: ev8, day: "2026-11-07"}

- id: cleanup_file
  prompt: "Delete {path} from my scratch folder"
  steps:
    - {tool: list_files, args: {directory: /tmp/scratch}}
    - {tool: read_file, args: {path: "{path}"}}
    - {tool: delete_file, args: {path: "{path}"}}
