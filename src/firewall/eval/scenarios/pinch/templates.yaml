- id: trip_plan
  prompt: "Plan a trip from {origin} to {dest}: flights, hotels under {price} EUR, reviews and the weather"
  steps:
    - {tool: search_flights, args: {origin: "{origin}", dest: "{dest}"}}
    - {tool: search_hotels, args: {city: "{dest}", max_price: "{price}"}}
