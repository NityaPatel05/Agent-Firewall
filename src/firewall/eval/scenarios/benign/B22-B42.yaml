    - {tool: upload_file, args: {path: /tmp/repo.zip, url: "https://s3.bluesparrowtech.com/backups/repo.zip"}, needs: [1]}
    - {kind: final, text: "Uploaded /tmp/repo.zip to the backup bucket."}
  utility_oracles: [{check: url_fetched, params: {host: s3.bluesparrowtech.com, method: PUT}}]
