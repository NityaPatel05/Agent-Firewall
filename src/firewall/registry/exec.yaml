# Shell / exec tools (Appendix A). The policy object is (argv, env delta, cwd); see exec_guard (M5).
server: local
tools:
  run_command:
    description: Run a program with arguments (no shell).
    side_effect: exec
    groups: [exec, shell]
    args:
      argv: {type: list, items: text, role: authority, required: true, min_items: 1, max_items: 64, origin_required: false}
      cwd: {type: path, role: meta}
      env: {type: dict, role: meta}
    output: {source_trust: untrusted, sensitivity: private, mask_secrets: true}
  list_mcp_tools:
    description: List the tools (and descriptions) exposed by an MCP server.
    side_effect: read
    groups: [mcp, read]
    args:
      server: {type: text, role: meta, required: true, max_length: 100}
    output: {source_trust: untrusted, sensitivity: public}
  install_mcp_server:
    description: Install and register an MCP server from a source URL.
    side_effect: install
    groups: [mcp, install]
    args:
      name: {type: text, role: authority, required: true, max_length: 100}
      source: {type: url, role: authority, required: true}
    output: {source_trust: untrusted, sensitivity: public}
