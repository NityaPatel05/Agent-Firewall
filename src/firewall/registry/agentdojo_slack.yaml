# AgentDojo v1.2.2 slack suite (Appendix G). Users/channels are bare names ("Alice", "general") and URLs may be
# scheme-less ("www.informations.com"), so they are typed `text` (our handle/channel/url canonicalizers would
# rewrite or reject them). Message bodies and web pages are untrusted.
server: local
tools:
  get_channels:
    description: Get the list of channels in the slack.
    side_effect: read
    groups: [slack, read]
    args: {}
    # Channel names are attacker-influenced in AgentDojo (an injection vector lives in an external channel name).
    output: {source_trust: untrusted, sensitivity: private}
  get_users_in_channel:
    description: Get the list of users in the given channel.
    side_effect: read
    groups: [slack, read]
    args:
      channel: {type: text, role: selector, required: true, max_length: 200}
    output: {source_trust: own_record, sensitivity: private}
  read_channel_messages:
    description: Read the messages from the given channel.
    side_effect: read
    groups: [slack, read]
    ref_arg: channel
    args:
      channel: {type: text, role: selector, required: true, max_length: 200}
    output:
      source_trust: untrusted
      sensitivity: private
      item_path: "[*]"
      author_field: sender
  read_inbox:
    description: Read the messages from the given user inbox.
    side_effect: read
    groups: [slack, read]
    ref_arg: user
    args:
      user: {type: text, role: selector, required: true, max_length: 200}
    output:
      source_trust: untrusted
      sensitivity: private
      item_path: "[*]"
      author_field: sender
  get_webpage:
    description: Returns the content of the webpage at a given URL.
    side_effect: fetch
    groups: [web]
    ref_arg: url
    args:
      url: {type: text, role: authority, required: true, origin_required: false, max_length: 2000}
    output: {source_trust: untrusted, sensitivity: public}
  send_direct_message:
    description: Send a direct message to a user.
    side_effect: external_comm
    groups: [slack, chat_send]
    sink: true
    destination: {arg: recipient, kind: text}
    args:
      recipient: {type: text, role: authority, required: true, max_length: 200}
      body: {type: text, role: content, required: true, max_length: 20000}
    output: {source_trust: own_record, sensitivity: private}
  send_channel_message:
    description: Send a channel message.
    side_effect: external_comm
    groups: [slack, chat_send]
    sink: true
    destination: {arg: channel, kind: text}
    args:
      channel: {type: text, role: authority, required: true, max_length: 200}
      body: {type: text, role: content, required: true, max_length: 20000}
    output: {source_trust: own_record, sensitivity: private}
  add_user_to_channel:
    description: Add a user to a given channel.
    side_effect: share
    groups: [slack, share]
    sink: true
    destination: {arg: user, kind: text}
    args:
      user: {type: text, role: authority, required: true, max_length: 200}
      channel: {type: text, role: selector, required: true, max_length: 200}
    output: {source_trust: own_record, sensitivity: private}
  invite_user_to_slack:
    description: Invites a user to the Slack workspace.
    side_effect: share
    groups: [slack, share, invite]
    sink: true
    destination: {arg: user_email, kind: email}
    args:
      user: {type: text, role: authority, required: true, max_length: 200}
      user_email: {type: email, role: authority, required: true}
    output: {source_trust: own_record, sensitivity: private}
  remove_user_from_slack:
    description: Remove a user from the Slack workspace.
    side_effect: delete
    groups: [slack, delete]
    args:
      user: {type: text, role: authority, required: true, max_length: 200}
    output: {source_trust: own_record, sensitivity: private}
  post_webpage:
    description: Posts a webpage at a given URL with the given content.
    side_effect: external_comm
    groups: [web, publish]
    sink: true
    destination: {arg: url, kind: text}
    args:
      url: {type: text, role: authority, required: true, max_length: 2000}
      content: {type: text, role: content, required: true, max_length: 50000}
    output: {source_trust: own_record, sensitivity: private}
