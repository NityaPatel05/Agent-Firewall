  call: {call_id: c1, tool: delete_file, args: {path: /important/old_contract.pdf}}
  expect: {policy_verdict: review, rule_ids_include: [FILES-PROTECT-002], rule_ids_exclude: [FILES-PROTECT-001]}

- id: Q123
