  since: M3
  events: [{user: "Run the test suite"}]
  call: {call_id: c1, tool: run_command, args: {argv: [rm, -rf, pytest]}}
  expect: {policy_verdict: review, rule_ids_include: [DEFAULT-EXEC], rule_ids_exclude: [EXEC-TEST-001]}

