  since: M3
  events: [{user: "Fix the typo in this file and save"}]
  call: {call_id: c1, tool: write_file, args: {path: /repo/.cursor/mcp.json, content: "{}"}}
  given: {origins: {path: UNTRUSTED_ONLY}}
