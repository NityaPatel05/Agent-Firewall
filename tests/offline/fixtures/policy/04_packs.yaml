  call: {call_id: c1, tool: post_form, args: {url: "https://jobs.example.com/apply", fields: {name: Emma Johnson}}}
  given:
    destinations: [{arg: url, kind: url, value: "https://jobs.example.com/apply", origin_class: USER_TYPED}]
