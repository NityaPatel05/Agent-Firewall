  events: [{user: "Run the test suite"}]
  call: {call_id: c1, tool: run_command, args: {argv: [pytest, -q]}}
  expect: {sink_rule_ids: []}

- id: K028
  description: T9 - allow-listed binary with a poisoned PAGER env var
  since: M5
