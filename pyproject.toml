[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-firewall"
version = "0.1.0"
description = "Provenance-aware tool-call gateway against indirect prompt injection"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "python-dotenv>=1.1,<2",
  "fastjsonschema>=2.21,<3",
]

[project.optional-dependencies]
agent = [
  "langchain==1.4.7",
  "langgraph==1.2.19",
  "langchain-core>=1.6.10,<2",
]
llm = [
  "langchain-google-genai==4.4.2",
  "google-genai>=2.20,<3",
  "langchain-groq==1.1.3",
  "tenacity>=9.1,<10",
]
service = [
  "fastapi==0.162.0",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
]
eval = [
  "numpy>=2.2,<3",
  "matplotlib>=3.10,<4",
  "rich>=14,<15",
]
detectors = [            # install CPU torch first: pip install torch --index-url https://download.pytorch.org/whl/cpu
  "torch>=2.8,<3",
  "transformers>=4.56,<6",
  "huggingface-hub>=0.34,<2",
]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio==1.4.1",
  "hypothesis>=6.130,<7",
  "pytest-benchmark>=5.1,<6",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.12",
]
all = ["agent-firewall[agent,llm,service,eval,dev]"]
# agentdojo is installed separately from a pinned commit (M11), never from PyPI 0.1.35.

[tool.hatch.build.targets.wheel]
packages = ["src/firewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "live: needs network and API keys (opt-in with --run-live)",
  "models: needs Hugging Face model weights (opt-in with --run-models)",
  "agentdojo: needs agentdojo installed and --run-agentdojo (skipped otherwise)",
  "slow: takes more than 5 seconds",
]

[tool.ruff]
line-length = 110
target-version = "py313"
